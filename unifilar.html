<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <title>Configurador Unifilar Avanzado - Estilo AutoCAD</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #0f766e;
            --bg: #f8fafc;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            /* Paleta AutoCAD Model Space */
            --cad-bg: #14191e;
            --cad-linea: #ffffff;
            --cad-texto-attr: #ffff00; /* Amarillo */
            --cad-texto-c: #00ffff;    /* Cian */
            --cad-simbolo: #00ff00;   /* Verde */
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container { max-width: 100%; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn {
            background: #475569;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #334155; }
        .btn-accent { background: var(--accent); }
        .btn-accent:hover { background: #0d615a; }

        .workspace {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel-config {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            max-height: 90vh;
            overflow-y: auto;
        }

        .panel-config h3 { margin-top: 18px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;}
        .panel-config h3:first-child { margin-top: 0; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569;}
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;}

        .lista-items {
            margin-top: 10px;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            padding: 5px;
            background: #f8fafc;
            border-radius: 4px;
        }

        .item-row {
            background: white;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .btn-mini {
            padding: 3px 6px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin-left: 2px;
        }
        .btn-edit { background-color: var(--warning); }
        .btn-del { background-color: var(--danger); }

        .order-btns { display: inline-flex; gap: 2px; margin-top: 4px; }
        .order-btns button { padding: 2px 5px; font-size: 10px; cursor: pointer; }

        .unifilar-scroll-container {
            overflow-x: auto;
            background: var(--cad-bg);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 3px solid #2e3842;
            padding: 30px;
        }

        .unifilar-scroll-container.modo-impresion {
            background: #ffffff !important;
            border: 1px solid #000000 !important;
            box-shadow: none !important;
        }
		/* Estilos para el contenedor tipo acordeón */
.panel-config h3 {
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 5px;
    margin-top: 10px;
    background: #f1f5f9;
    border-radius: 4px;
    border-bottom: none;
    user-select: none;
    transition: background 0.2s ease;
}
.panel-config h3:hover {
    background: #e2e8f0;
}
/* Icono indicador de despliegue */
.panel-config h3::after {
    content: '▼';
    font-size: 10px;
    color: #64748b;
    transition: transform 0.2s ease;
}
.panel-config h3.colapsado::after {
    transform: rotate(-90deg);
}
/* Contenedor del contenido que se oculta/muestra */
.bloque-colapsable {
    transition: max-height 0.2s ease-out, opacity 0.2s ease-out, margin 0.2s ease;
    overflow: hidden;
    max-height: 1000px; /* Altura máxima estimada para que la animación funcione */
    opacity: 1;
}
.bloque-colapsable.oculto {
    max-height: 0 !important;
    opacity: 0 !important;
    margin-bottom: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    pointer-events: none;
}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 style="margin:0; font-size:22px;">📊 Unifilar Pro Vectorial</h1>
            <p style="margin:4px 0 0 0; font-size:13px; color:#94a3b8;">Renderizado dinámico de esquemas en entorno CAD industrial</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="conmutarModoImpresion()" class="btn" style="background:#0284c7;">👁️ Fondo Blanco/Negro</button>
            <button onclick="exportarPDF()" class="btn btn-accent">📄 Exportar Memoria PDF</button>
			<div class="acciones-plano" style="margin-bottom: 10px; display: flex; gap: 10px;">
    <button type="button" onclick="exportarComoImagen()" class="btn" style="background: #0284c7; color: white;">🖼️ Exportar como Imagen (PNG)</button>
    <button type="button" onclick="exportarComoPDF()" class="btn" style="background: #059669; color: white;">📄 Descargar Plano PDF</button>
</div>
            <a href="/calculos" class="btn">⬅️ Volver a Conductores</a>
        </div>
    </div>

    <div class="workspace">
        
       <div class="panel-config">
            <h3 onclick="conmutarSeccion(this)">🔌 Configurar Derivación Individual</h3>
            <div class="bloque-colapsable" style="background:#f0f4f8; padding:12px; border:1px solid #d9e2ec; border-radius:6px; margin-bottom:15px;">
                <div class="form-group">
                    <label>Material del Conductor:</label>
                    <select id="di-material" onchange="actualizarDI()">
                        <option value="Cu" selected>Cobre (Cu)</option>
                        <option value="Al">Aluminio (Al)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sección Nominal:</label>
                    <select id="di-seccion" onchange="actualizarDI()">
                        <option value="6">6 mm²</option>
                        <option value="10" selected>10 mm²</option>
                        <option value="16">16 mm²</option>
                        <option value="25">25 mm²</option>
                        <option value="35">35 mm²</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Longitud de la Línea (m):</label>
                    <input type="number" id="di-longitud" value="15" min="1" step="0.5" oninput="actualizarDI()">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Tipo de Suministro:</label>
                    <select id="di-sistema" onchange="actualizarDI()">
                        <option value="monofasico" selected>Monofásico (230 V)</option>
                        <option value="trifasico">Trifásico (400 V)</option>
                    </select>
                </div>
            </div>
            
            <h3 onclick="conmutarSeccion(this)">🛠️ 1. Configurar IGA General</h3>
            <div class="bloque-colapsable" style="background:#f8fafc; padding:12px; border:1px solid #e2e8f0; border-radius:4px; margin-bottom:15px;">
                <div class="form-group">
                    <label>Calibre del IGA (In):</label>
                    <select id="iga-calibre" onchange="actualizarIGA()">
                        <option value="25A">25 A</option>
                        <option value="32A">32 A</option>
                        <option value="40A">40 A</option>
                        <option value="50A" selected>50 A</option>
                        <option value="63A">63 A</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Poder de Corte IGA:</label>
                    <select id="iga-cortocircuito" onchange="actualizarIGA()">
                        <option value="4.5 kA">4,5 kA</option>
                        <option value="6 kA">6 kA</option>
                        <option value="10 kA" selected>10 kA (Recomendado)</option>
                        <option value="15 kA">15 kA</option>
                    </select>
                </div>
            </div>

            <h3 id="form-id-title" onclick="conmutarSeccion(this)">⚙️ 2. Añadir Diferencial</h3>
            <div class="bloque-colapsable">
                <form id="form-id" onsubmit="procesarDiferencial(event)" style="margin-bottom: 15px;">
                    <input type="hidden" id="edit-id-idx" value="-1">
                    <div class="form-group">
                        <label>Nombre del Diferencial:</label>
                        <input type="text" id="id-nombre" placeholder="Ej. ID 2 - Cocina" required>
                    </div>
                    <div class="form-group">
                        <label>Sensibilidad / Calibre:</label>
                        <select id="id-valores">
                            <option value="40A / 30mA">40A / 30mA (Estándar)</option>
                            <option value="25A / 30mA">25A / 30mA</option>
                            <option value="63A / 30mA">63A / 30mA</option>
                            <option value="40A / 300mA">40A / 300mA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Red / Polos:</label>
                        <select id="id-tipo" onchange="actualizarVisibilidadSelectorFase()">
                            <option value="monofasico" selected>Monofásico (2P)</option>
                            <option value="trifasico">Trifásico (4P)</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button type="submit" id="btn-id-submit" class="btn btn-accent" style="flex:1; padding:6px;">➕ Añadir</button>
                        <button type="button" id="btn-id-cancel" onclick="cancelarEdicionID()" class="btn" style="padding:6px; background:#94a3b8; display:none;">Cancelar</button>
                    </div>
                </form>
            </div>

            <h3 onclick="conmutarSeccion(this)">📋 Listado de Diferenciales</h3>
            <div class="bloque-colapsable lista-items" id="lista-gestion-ids"></div>

            <h3 onclick="conmutarSeccion(this)">🔄 3. Disposición y Asociación</h3>
            <div class="bloque-colapsable lista-items" id="lista-gestion-circuitos"></div>
        </div>

        <div class="unifilar-scroll-container" id="contenedor-plano">
            <svg id="cad-canvas" width="100%" height="700" version="1.1" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; display: block; margin: 0 auto;">
            </svg>
        </div>

    </div>
</div>

<script>
    let individualesActivosGlobales = [];
    let diferenciales = JSON.parse(localStorage.getItem('unifilar_diferenciales')) || [
        { id: "id_gen", nombre: "ID 1 - General", valores: "40A / 30mA", tipo: "monofasico" },
        { id: "id_cocina", nombre: "ID 2 - Cocina y Baño", valores: "40A / 30mA", tipo: "monofasico" }
    ];
    // Asegurar retrocompatibilidad si venían sin la propiedad tipo instalada en el localStorage
    diferenciales.forEach(d => { if(!d.tipo) d.tipo = "monofasico"; });

    let configIGA = JSON.parse(localStorage.getItem('unifilar_iga')) || { calibre: "50A", poderCorte: "10 kA" };
    let configDI = JSON.parse(localStorage.getItem('unifilar_di')) || { material: "Cu", seccion: "10", longitud: "15", sistema: "monofasico" };
    let ordenCircuitos = [];
    let potenciaTotalCuadro = 0;
    let modoImpresionActivo = false;

document.addEventListener('DOMContentLoaded', async () => {
    const idProyecto = localStorage.getItem('proyecto_activo_id');
    if (!idProyecto) {
        console.log("ℹ️ No hay un ID de proyecto activo en el LocalStorage.");
        cargarDatosOriginales();
        return;
    }

    try {
        const respuesta = await fetch(`/api/proyectos/obtener/${idProyecto}?_=${new Date().getTime()}`);
        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.status === 'success' && resultado.proyecto) {
            const proyecto = resultado.proyecto;
            const datosCuadro = proyecto.datos_cuadro || {};
            const circuitosServidor = datosCuadro.circuitos || [];

            if (circuitosServidor.length > 0) {
                console.log(`🔌 Sincronizando ${circuitosServidor.length} circuitos con el esquema...`);
                
                ordenCircuitos = circuitosServidor.map(c => {
                    let mapaExistente = JSON.parse(localStorage.getItem('unifilar_mapeo_circuitos')) || {};
                    let idDiferencialAsignado = mapaExistente[c.circuito];

                    if (!idDiferencialAsignado) {
                        idDiferencialAsignado = (typeof diferenciales !== 'undefined' && diferenciales[0]) ? diferenciales[0].id : "id_gen";
                    }

                    return {
                        id: c.circuito || '',                 
                        potencia: parseFloat(c.potencia) || 0, 
                        longitud: parseFloat(c.longitud) || 0, 
                        seccion: c.seccion || '2.5',          
                        magneto: c.pia || '16',                
                        sistema: c.red || 'Monofásico',        
                        diferencialAsignado: idDiferencialAsignado,
                        res_calculados: {
                            intensidad: parseFloat(c.ib) || 0,
                            iz_admisible: parseFloat(c.iz) || 0,
                            tubo: c.canalizacion || '20',
                            caida_porcentaje: parseFloat(c.delta_u) || 0
                        }
                    };
                });

                localStorage.setItem('unifilar_orden_circuitos', JSON.stringify(ordenCircuitos));
                refrescarTodo();
            } else {
                console.log("ℹ️ El proyecto está en el servidor pero no contiene circuitos.");
                cargarDatosOriginales();
            }
        } else {
            cargarDatosOriginales();
        }
    } catch (error) {
        console.error("❌ Error al renderizar el unifilar desde el servidor:", error);
        cargarDatosOriginales();
    }
});

function conmutarSeccion(elementoTitulo) {
    // Alterna la clase visual de la flecha en el h3
    elementoTitulo.classList.toggle('colapsado');
    
    // Obtiene el elemento hermano que está justo después del título
    const contenido = elementoTitulo.nextElementSibling;
    if (contenido) {
        contenido.classList.toggle('oculto');
    }
}
    function cargarDatosOriginales() {
        fetch('/calcular', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ commit: false })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success" && data.cuadro) {
                potenciaTotalCuadro = data.p_coinc || 0;
                sincronizarOrden(data.cuadro);
            } else {
                potenciaTotalCuadro = 4600;
                const mockCuadro = [
                    { id: "C1 - ILUMINACIÓN", potencia: 2300, seccion: 1.5, longitud: 20, magneto: 10, res_calculados: { caida_porcentaje: "2.39" } },
                    { id: "C2 - TOMAS GENERALES", potencia: 3450, seccion: 2.5, longitud: 25, magneto: 16, res_calculados: { caida_porcentaje: "1.85" } }
                ];
                sincronizarOrden(mockCuadro);
            }
            refrescarTodo();
        })
        .catch(() => {
            potenciaTotalCuadro = 4600;
            const mockCuadro = [
                { id: "C1 - ILUMINACIÓN", potencia: 2300, seccion: 1.5, longitud: 20, magneto: 10, res_calculados: { caida_porcentaje: "2.39" } },
                { id: "C2 - TOMAS GENERALES", potencia: 3450, seccion: 2.5, longitud: 25, magneto: 16, res_calculados: { caida_porcentaje: "1.85" } }
            ];
            sincronizarOrden(mockCuadro);
            refrescarTodo();
        });
    }

    function refrescarTodo() {
        renderizarControlesID();
        renderizarControlesCircuitos();
        actualizarDI();
    }

    function conmutarModoImpresion() {
        const contenedor = document.getElementById('contenedor-plano');
        modoImpresionActivo = !modoImpresionActivo;
        if (modoImpresionActivo) {
            contenedor.classList.add('modo-impresion');
        } else {
            contenedor.classList.remove('modo-impresion');
        }
        construirUnifilarGrafico();
    }

function actualizarDI() {
        if(document.getElementById('di-material')) configDI.material = document.getElementById('di-material').value;
        if(document.getElementById('di-seccion')) configDI.seccion = parseFloat(document.getElementById('di-seccion').value);
        if(document.getElementById('di-longitud')) configDI.longitud = parseFloat(document.getElementById('di-longitud').value) || 0;
        if(document.getElementById('di-sistema')) configDI.sistema = document.getElementById('di-sistema').value;
        localStorage.setItem('unifilar_di', JSON.stringify(configDI));

        // 🌟 CORRECCIÓN: Si potenciaTotalCuadro no se ha cargado o es 0, sumamos la potencia real de los circuitos activos
        let potenciaCalculo = parseFloat(potenciaTotalCuadro) || 0;
        if (potenciaCalculo === 0 && ordenCircuitos && ordenCircuitos.length > 0) {
            potenciaCalculo = ordenCircuitos.reduce((acc, c) => acc + (parseFloat(c.potencia) || 0), 0);
        }

        // Si aun así no hay potencia (cuadro vacío), evitamos el cálculo erróneo
        if (potenciaCalculo === 0) potenciaCalculo = 4600; // Valor mínimo de cortesía para que se mueva el gráfico

        const cond = configDI.material === "Cu" ? 48.47 : 29.56; 
        const tension = configDI.sistema === "monofasico" ? 230 : 400;
        
        // 🌟 CORRECCIÓN DE LA FÓRMULA REBT:
        // Monofásico: 2 * L * P / (𝛾 * S * V)   -> (V en el denominador para % o V² para voltios, corregido a porcentaje directo)
        let cdt = 0;
        if (configDI.sistema === "monofasico") {
            cdt = (2 * potenciaCalculo * configDI.longitud) / (cond * configDI.seccion * Math.pow(tension, 2));
        } else {
            cdt = (potenciaCalculo * configDI.longitud) / (cond * configDI.seccion * Math.pow(tension, 2));
        }
        
        configDI.cdtCalculada = (cdt * 100).toFixed(2);
		actualizarVisibilidadSelectorFase();
        construirUnifilarGrafico();
    }

    function actualizarIGA() {
        configIGA.calibre = document.getElementById('iga-calibre').value;
        configIGA.poderCorte = document.getElementById('iga-cortocircuito').value;
        localStorage.setItem('unifilar_iga', JSON.stringify(configIGA));
        construirUnifilarGrafico();
    }

// --- RENDERIZADO DEL PLANO VECTORIAL CAD ---
function construirUnifilarGrafico() {
    const svg = document.getElementById('cad-canvas');
    if (!svg) return;
    svg.innerHTML = ""; 

    const colorLinea = modoImpresionActivo ? "#000000" : "#ffffff";
    const colorSimbolo = modoImpresionActivo ? "#000000" : "#00ff00"; 
    const colorAttr = modoImpresionActivo ? "#000000" : "#ffff00";   
    const colorCircuito = modoImpresionActivo ? "#000000" : "#00ffff"; 

    let individualesActivos = diferenciales.filter(d => ordenCircuitos.some(c => c.diferencialAsignado === d.id));
    if (individualesActivos.length === 0 && diferenciales.length > 0) {
        individualesActivos = [diferenciales[0]];
    }

    const anchoColumnaCircuito = 220;  
    const margenIzquierdo = 80;
    const separacionDiferenciales = 80; 

    let sistemaGeneralLimpio = String(configDI.sistema || 'monofasico').toLowerCase();
    const esDITrifasica = sistemaGeneralLimpio.includes("tri") || sistemaGeneralLimpio.includes("400");
    
    const prefijoHilosAcometida = esDITrifasica ? "4x" : "2x";
    const polosIGA = esDITrifasica ? "4P" : "2P";

    let listaCoordenadasDiferenciales = [];
    let xAcumulada = margenIzquierdo;

    individualesActivos.forEach(d => {
        let hijos = ordenCircuitos.filter(c => c.diferencialAsignado === d.id);
        let nColumnas = Math.max(1, hijos.length);
        let anchoBloque = nColumnas * anchoColumnaCircuito;
        
        let xInicioSubembarrado = xAcumulada + (anchoColumnaCircuito / 2);
        let xFinSubembarrado = xAcumulada + anchoBloque - (anchoColumnaCircuito / 2);
        let xCentroDiferencial = (xInicioSubembarrado + xFinSubembarrado) / 2;

        listaCoordenadasDiferenciales.push({
            id: d.id, xCentro: xCentroDiferencial, xInicio: xInicioSubembarrado, xFin: xFinSubembarrado, xBaseIzquierda: xAcumulada, hijosCount: hijos.length
        });
        xAcumulada += anchoBloque + separacionDiferenciales;
    });

    const anchoPlano = xAcumulada - separacionDiferenciales + margenIzquierdo;
    svg.setAttribute("viewBox", `0 0 ${Math.max(950, anchoPlano)} 620`);

    if(listaCoordenadasDiferenciales.length === 0) return;
    
    const centroGlobalX = (listaCoordenadasDiferenciales[0].xCentro + listaCoordenadasDiferenciales[listaCoordenadasDiferenciales.length - 1].xCentro) / 2;

    let dibujoIGAGrafico = '';
    if (esDITrifasica) {
        const dX = 8;
        dibujoIGAGrafico = `
            <line x1="${centroGlobalX}" y1="80" x2="${centroGlobalX}" y2="95" stroke="${colorSimbolo}" stroke-width="2"/>
            <line x1="${centroGlobalX - 1.5 * dX}" y1="95" x2="${centroGlobalX - 1.5 * dX}" y2="102" stroke="${colorSimbolo}" stroke-width="2"/>
            <line x1="${centroGlobalX - 1.5 * dX}" y1="102" x2="${centroGlobalX - 1.5 * dX + 10}" y2="122" stroke="${colorSimbolo}" stroke-width="2" stroke-linecap="round"/>
            <line x1="${centroGlobalX - 1.5 * dX}" y1="122" x2="${centroGlobalX - 1.5 * dX}" y2="135" stroke="${colorSimbolo}" stroke-width="2"/>
            <path d="M ${centroGlobalX - 1.5 * dX - 4} 97 L ${centroGlobalX - 1.5 * dX + 4} 97 M ${centroGlobalX - 1.5 * dX - 4} 127 L ${centroGlobalX - 1.5 * dX + 4} 127" stroke="${colorSimbolo}" stroke-width="1.2"/>
            <line x1="${centroGlobalX - 0.5 * dX}" y1="95" x2="${centroGlobalX - 0.5 * dX}" y2="102" stroke="${colorSimbolo}" stroke-width="2"/>
            <line x1="${centroGlobalX - 0.5 * dX}" y1="102" x2="${centroGlobalX - 0.5 * dX + 10}" y2="122" stroke="${colorSimbolo}" stroke-width="2" stroke-linecap="round"/>

        individualesActivos = JSON.parse(localStorage.getItem('unifilar_diferenciales')) || [];
    }

    ordenCircuitos = cuadroServidor.map(c => {
        let idFijo = c.circuito || c.id || '';
        let idAsignado = mapaExistente[idFijo];
        let existe = individualesActivos.some(d => d.id === idAsignado);
        
        if (!idAsignado || !existe) {
            idAsignado = individualesActivos[0] ? individualesActivos[0].id : "id_gen";
        }
        
        let redDetectada = c.red || c.sistema || "Monofásico";
        let magnetoDetectado = c.pia || c.magneto || '16';

        return { 
            id: idFijo,
            potencia: parseFloat(c.potencia) || 0,
            seccion: c.seccion || '2.5',
            longitud: parseFloat(c.longitud) || 0,
            sistema: redDetectada, 
            magneto: magnetoDetectado,
            res_calculados: c.res_calculados || {
                intensidad: parseFloat(c.ib) || 0,
                iz_admisible: parseFloat(c.iz) || 0,
                tubo: c.canalizacion || '20',
                caida_porcentaje: parseFloat(c.delta_u) || 0
            },
            diferencialAsignado: idAsignado 
        };
    });
    
    localStorage.setItem('unifilar_orden_circuitos', JSON.stringify(ordenCircuitos));
    guardarEstadoLocal();
}

    function guardarEstadoLocal() {
        localStorage.setItem('unifilar_diferenciales', JSON.stringify(diferenciales));
        let mapaGuardar = {};
        ordenCircuitos.forEach(c => { mapaGuardar[c.id] = c.diferencialAsignado; });
        localStorage.setItem('unifilar_mapeo_circuitos', JSON.stringify(mapaGuardar));
    }

function procesarDiferencial(e) {
        e.preventDefault();
        const nombre = document.getElementById('id-nombre').value;
        const valores = document.getElementById('id-valores').value;
        const tipo = document.getElementById('id-tipo').value; 
        
        const selectorFase = document.getElementById('id-fase');
        const fase = selectorFase ? selectorFase.value : 'L1';
        
        const editIdx = parseInt(document.getElementById('edit-id-idx').value);

        if (editIdx === -1) {
            diferenciales.push({ 
                id: "id_" + Date.now(), 
                nombre: nombre, 
                valores: valores, 
                tipo: tipo, 
                fase: fase 
            });
        } else {
            diferenciales[editIdx].nombre = nombre;
            diferenciales[editIdx].valores = valores;
            diferenciales[editIdx].tipo = tipo; 
            diferenciales[editIdx].fase = fase; 
        }
        guardarEstadoLocal();
        cancelarEdicionID();
        refrescarTodo();
    }

function editarID(index) {
        const d = diferenciales[index];
        if(!d.tipo) d.tipo = "monofasico";

        document.getElementById('edit-id-idx').value = index;
        document.getElementById('id-nombre').value = d.nombre;
        document.getElementById('id-valores').value = d.valores;
        document.getElementById('id-tipo').value = d.tipo; 
        
        actualizarVisibilidadSelectorFase();
        if(document.getElementById('id-fase')) {
            document.getElementById('id-fase').value = d.fase || 'L1';
        }
        
        document.getElementById('form-id-title').innerText = "📝 Editando Diferencial";
        document.getElementById('btn-id-submit').innerText = "Guardar 💾";
        document.getElementById('btn-id-cancel').style.display = "inline-block";
		// Forzar la apertura del bloque del formulario si estuviera cerrado al editar
    const tituloForm = document.getElementById('form-id-title');
    tituloForm.classList.remove('colapsado');
    tituloForm.nextElementSibling.classList.remove('oculto');
    }

function cancelarEdicionID() {
        document.getElementById('form-id').reset();
        document.getElementById('edit-id-idx').value = "-1";
        document.getElementById('id-tipo').value = "monofasico"; 
        document.getElementById('form-id-title').innerText = "⚙️ 2. Añadir Diferencial";
        document.getElementById('btn-id-submit').innerText = "Añadir";
        document.getElementById('btn-id-cancel').style.display = "none";
        actualizarVisibilidadSelectorFase();
    }
function eliminarID(index) {
        if (diferenciales.length <= 1) { alert("⚠️ Se necesita al menos un diferencial."); return; }
        if (!confirm(`¿Eliminar "${diferenciales[index].nombre}"?`)) return;
        
        const idAEliminar = diferenciales[index].id;
        diferenciales.splice(index, 1);
        
        // Reasignar los circuitos huérfanos al primer diferencial disponible
        ordenCircuitos.forEach(c => { 
            if (c.diferencialAsignado === idAEliminar) c.diferencialAsignado = diferenciales[0].id; 
        });
        
        guardarEstadoLocal();
        cancelarEdicionID();
        refrescarTodo();
    }

function actualizarVisibilidadSelectorFase() {
        const sistemaDI = document.getElementById('di-sistema').value;
        const tipoDiferencial = document.getElementById('id-tipo').value;
        const contenedorFase = document.getElementById('contenedor-selector-fase');
        
        // Solo se elige fase si el suministro general es trifásico pero el diferencial es monofásico
        if (sistemaDI === 'trifasico' && tipoDiferencial === 'monofasico') {
            if (!contenedorFase) {
                const form = document.getElementById('form-id');
                const divBotones = form.lastElementChild; 
                
                const nuevoDiv = document.createElement('div');
                nuevoDiv.className = 'form-group';
                nuevoDiv.id = 'contenedor-selector-fase';
                nuevoDiv.innerHTML = `
                    <label>Fase de Conexión (Reparto Cargas):</label>
                    <select id="id-fase">
                        <option value="L1" selected>Fase R (L1)</option>
                        <option value="L2">Fase S (L2)</option>
                        <option value="L3">Fase T (L3)</option>
                    </select>
                `;
                form.insertBefore(nuevoDiv, divBotones);
            }
        } else {
            if (contenedorFase) contenedorFase.remove();
        }
    }

function renderizarControlesID() {
    const contenedor = document.getElementById('lista-gestion-ids');
    contenedor.innerHTML = "";
    const sistemaDI = document.getElementById('di-sistema').value;

    diferenciales.forEach((d, idx) => {
        const div = document.createElement('div');
        div.className = 'item-row';
        
        // Si es trifásico, añade una etiqueta visual de color indicando la fase
        let txtFase = '';
        if (sistemaDI === 'trifasico') {
            const faseActual = d.fase || 'L1';
            let colorEtiqueta = '#ef4444'; // Rojo para R
            if (faseActual === 'L2') colorEtiqueta = '#3b82f6'; // Azul para S
            if (faseActual === 'L3') colorEtiqueta = '#10b981'; // Verde para T
            txtFase = ` <span style="background:${colorEtiqueta}; color:white; padding:1px 4px; border-radius:3px; font-size:9px; font-weight:bold; margin-left:5px;">${faseActual}</span>`;
        }

        div.innerHTML = `<div><strong>${d.nombre}</strong>${txtFase}<br><span style="font-size:10px; color:#64748b;">${d.valores}</span></div>
                         <div><button class="btn-mini btn-edit" onclick="editarID(${idx})">✏️</button><button class="btn-mini btn-del" onclick="eliminarID(${idx})">🗑️</button></div>`;
        contenedor.appendChild(div);
    });
}

    function renderizarControlesCircuitos() {
        const contenedor = document.getElementById('lista-gestion-circuitos');
        if(!contenedor) return;
        contenedor.innerHTML = "";
        if (ordenCircuitos.length === 0) { contenedor.innerHTML = "<p style='font-size:12px; color:#64748b; text-align:center;'>Sin circuitos.</p>"; return; }
        ordenCircuitos.forEach((c, idx) => {
            const div = document.createElement('div');
            div.className = 'item-row';
            let opcionesDiferenciales = diferenciales.map(d => `<option value="${d.id}" ${c.diferencialAsignado === d.id ? 'selected' : ''}>${d.nombre}</option>`).join('');
            div.innerHTML = `<div><strong>${c.id}</strong><br><div class="order-btns"><button onclick="moverPosicion(${idx}, -1)">◀</button><button onclick="moverPosicion(${idx}, 1)">▶</button></div></div>
                             <div><select onchange="cambiarDiferencialCircuito('${c.id}', this.value)" style="font-size:11px; padding:4px;">${opcionesDiferenciales}</select></div>`;
            contenedor.appendChild(div);
        });
    }

    function cambiarDiferencialCircuito(circuitoId, nuevoIdDiferencial) {
        let c = ordenCircuitos.find(item => item.id === circuitoId);
        if (c) { c.diferencialAsignado = nuevoIdDiferencial; guardarEstadoLocal(); actualizarDI(); }
    }

    function moverPosicion(index, direccion) {
        let nuevaPos = index + direccion;
        if (nuevaPos >= 0 && nuevaPos < ordenCircuitos.length) {
            let temp = ordenCircuitos[index]; ordenCircuitos[index] = ordenCircuitos[nuevaPos]; ordenCircuitos[nuevaPos] = temp;
            renderizarControlesCircuitos(); actualizarDI();
        }
    }

    function exportarPDF() {
        const datosEnvio = {
            di: JSON.parse(localStorage.getItem('unifilar_di')) || configDI,
            iga: JSON.parse(localStorage.getItem('unifilar_iga')) || configIGA,
            diferenciales: diferenciales,
            mapeo: JSON.parse(localStorage.getItem('unifilar_mapeo_circuitos')) || {},
            circuitos: JSON.parse(localStorage.getItem('unifilar_orden_circuitos')) || ordenCircuitos || []
        };
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/exportar_unifilar_pdf';
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'datos';
        input.value = JSON.stringify(datosEnvio);
        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
    }
	// --- FUNCIÓN 1: EXPORTAR A IMAGEN (PNG ALTA RESOLUCIÓN) ---
function exportarComoImagen() {
    const svgElement = document.getElementById('cad-canvas');
    if (!svgElement) return;

    // Obtener las dimensiones del SVG original
    const viewBox = svgElement.getAttribute('viewBox');
    let width = 1200; // Valores por defecto por si acaso
    let height = 700;
    
    if (viewBox) {
        const partes = viewBox.split(' ');
        width = parseFloat(partes[2]);
        height = parseFloat(partes[3]);
    }

    // Convertir el SVG a un String de datos XML
    const xml = new XMLSerializer().serializeToString(svgElement);
    const svg64 = btoa(unescape(encodeURIComponent(xml)));
    const b64Start = 'data:image/svg+xml;base64,';
    const image64 = b64Start + svg64;

    // Crear una imagen virtual en memoria
    const img = new Image();
    img.src = image64;
    
    img.onload = function() {
        // Creamos un canvas con un multiplicador de densidad (x2) para que se vea estilo plano de alta definición
        const canvas = document.createElement('canvas');
        const escalaPro = 2; 
        canvas.width = width * escalaPro;
        canvas.height = height * escalaPro;
        
        const ctx = canvas.getContext('2d');
        ctx.scale(escalaPro, escalaPro);

        // Dibujar el fondo del plano según el modo actual
        ctx.fillStyle = modoImpresionActivo ? "#ffffff" : "#14191e";
        ctx.fillRect(0, 0, width, height);

        // Renderizar el SVG sobre el canvas
        ctx.drawImage(img, 0, 0, width, height);

        // Forzar la descarga del archivo PNG en el navegador
        const urlDescarga = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `Plano_Unifilar_${Date.now()}.png`;
        link.href = urlDescarga;
        link.click();
    };
}

// --- FUNCIÓN 2: EXPORTAR A PLANO PDF (FORMATO DIN A4 / A3 HORIZONTAL) ---
function exportarComoPDF() {
    const svgElement = document.getElementById('cad-canvas');
    if (!svgElement) return;

    const viewBox = svgElement.getAttribute('viewBox');
    let width = 1200;
    let height = 700;
    if (viewBox) {
        const partes = viewBox.split(' ');
        width = parseFloat(partes[2]);
        height = parseFloat(partes[3]);
    }

    const xml = new XMLSerializer().serializeToString(svgElement);
    const svg64 = btoa(unescape(encodeURIComponent(xml)));
    const image64 = 'data:image/svg+xml;base64,' + svg64;

    const img = new Image();
    img.src = image64;

    img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = width * 2;
        canvas.height = height * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);

        ctx.fillStyle = modoImpresionActivo ? "#ffffff" : "#14191e";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const imgData = canvas.toDataURL('image/png');

        // Accedemos a jsPDF usando el namespace correcto de su versión moderna
        const { jsPDF } = window.jspdf;
        
        // Creamos un PDF apaisado ('l' = landscape) adaptado al tamaño de nuestro plano
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [width, height]
        });

        // Insertamos la imagen y guardamos
        pdf.addImage(imgData, 'PNG', 0, 0, width, height);
        pdf.save(`Esquema_Unifilar_${Date.now()}.pdf`);
    };
}
